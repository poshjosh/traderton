name: Slow Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parity-drift:
    name: parity-drift
    runs-on: ubuntu-latest
    env:
      PARITY_DRIFT_CI: '1'
      HEROBIDS_ROOT: ${{ github.workspace }}/herobids
      TRADERTON_ROOT: ${{ github.workspace }}/traderton
    steps:
      - uses: actions/checkout@v4
        with:
          repository: poshjosh/herobids
          ref: 409b237a9ee7c239cfbe416ed8dac13cca007116
          path: herobids
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: traderton
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - working-directory: traderton
        run: pnpm test:slow