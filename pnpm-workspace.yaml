packages:
  - 'packages/*'
  - 'scripts'

# Adding the MCP SDK (@modelcontextprotocol/*, which nest zod 4) lets pnpm hoist
# zod 4 into abitype — an app-package (`@traderton/venues`) dependency that is
# otherwise satisfied by the workspace's zod 3.25.x. Pin abitype's zod back to
# the app version so zod 4 stays strictly under @modelcontextprotocol/* and never
# reaches a @traderton/* package (Phase 3 T2.2).
overrides:
  'abitype>zod': 3.25.76
