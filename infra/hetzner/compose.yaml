services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: traderton
      POSTGRES_DB: traderton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password required}
    volumes:
      - /srv/traderton/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderton -d traderton"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes:
      - /srv/traderton/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${BOUNDARY_IMAGE:?Boundary image required}
    command: ["pnpm", "--filter", "@traderton/db", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Database URL required}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

  boundary:
    image: ${BOUNDARY_IMAGE:?Boundary image required}
    restart: unless-stopped
    env_file: .env
    environment:
      BOUNDARY_HOST: 0.0.0.0
      BOUNDARY_PORT: "8080"
      # DATABASE_URL is derived by deploy.sh (URL-encoded POSTGRES_PASSWORD) and
      # exported there — it is NOT committed in .env.<env>. Without this, the
      # boundary falls back to config/default.yaml's localhost URL and cannot
      # reach Postgres on the compose network.
      DATABASE_URL: ${DATABASE_URL:?Database URL required}
    # No host port: the boundary is reachable only via caddy on the compose
    # network. HMAC authenticates every call; TLS is terminated at caddy.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  site:
    image: ${SITE_IMAGE:?Site image required}
    restart: unless-stopped
    # No host port: reachable only via caddy on the compose network. The site
    # carries no execution surface; the edge Caddy owns the /internal* +
    # /health* → 404 guard (Caddyfile.<env>, materialized as ./Caddyfile).
    expose:
      - "80"
    # Hardened, but Caddy binds :80 via a file capability (NET_BIND_SERVICE) on
    # /usr/bin/caddy. Drop everything EXCEPT that one cap, and do NOT set
    # no-new-privileges (it blocks the file-cap exec → "operation not permitted"
    # crash-loop). The boundary (Node on 8080, unprivileged) can drop ALL; Caddy
    # on :80 cannot.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      boundary:
        condition: service_healthy
      site:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config: